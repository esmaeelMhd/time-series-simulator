[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "timesim"
version = "0.1.0"
description = "General-purpose library for training time-series world models for control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["time-series", "world-models", "control", "reinforcement-learning", "mpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy",
    "pandas",
    "torch>=1.13",
    "omegaconf",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tqdm",
    "gymnasium>=0.26",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
all = [
    "tensorboard",
    "tslearn>=0.6",
    "numba>=0.57",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.scripts]
timesim-train = "timesim.cli.train:main"
timesim-retrain = "timesim.cli.retrain:main"

[project.urls]
Homepage = "https://github.com/yourusername/time-series-simulator"
Documentation = "https://github.com/yourusername/time-series-simulator"
Repository = "https://github.com/yourusername/time-series-simulator"
"Bug Tracker" = "https://github.com/yourusername/time-series-simulator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["timesim*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

