[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "timesim"
version = "0.1.0"
description = "General-purpose library for training time-series world models for control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Esmaeel Mohammadi", email = "s.mohammadi.rl@gmail.com"}
]
keywords = ["time-series", "world-models", "control", "reinforcement-learning", "mpc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy",
    "pandas",
    "polars",
    "torch>=2.10",
    "optuna>=3.5",
    "hydra-core>=1.3",
    "omegaconf",
    "pandera>=0.20",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "tqdm",
    "gymnasium>=0.26",
    "joblib>=1.3",
    "xgboost",
    "pytorch-lightning>=2.0",
    "litlogger",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "hypothesis>=6.0",
    "black",
    "flake8",
    "mypy",
    # starlette.testclient (used by tests/test_api.py) refuses to import
    # without httpx installed.
    "httpx>=0.27",
    "ruff",
]
tracking = [
    "wandb>=0.17",
    "mlflow>=2.14",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.30",
]
lightning = [
    "pytorch-lightning>=2.0",
    "litlogger",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
all = [
    "hydra-core>=1.3",
    "pytorch-lightning>=2.0",
    "litlogger",
    "wandb>=0.17",
    "mlflow>=2.14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.30",
    "pandera>=0.20",
    "hypothesis>=6.0",
    "polars",
    "tensorboard",
    "tslearn>=0.6",
    "numba>=0.57",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[project.scripts]
timesim-train = "timesim.cli.train:main"
timesim-retrain = "timesim.cli.retrain:main"
timesim-optimize = "timesim.cli.optimize:main"

[project.urls]
Homepage = "https://github.com/esmaeelMhd/time-series-simulator"
Documentation = "https://github.com/esmaeelMhd/time-series-simulator"
Repository = "https://github.com/esmaeelMhd/time-series-simulator"
"Bug Tracker" = "https://github.com/esmaeelMhd/time-series-simulator/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["timesim*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W293", "E741", "E402"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
