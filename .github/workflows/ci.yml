name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install fastapi uvicorn ruff

      - name: Lint
        run: |
          ruff check src scripts tests --select E9,F63,F7,F82

      - name: Unit Tests
        run: |
          pytest \
            tests/test_phase2b_rssm_cell.py \
            tests/test_phase2c_decoders.py \
            tests/test_phase3a_standard_losses.py \
            tests/test_phase1_data_pipeline.py \
            tests/test_simulator.py \
            tests/test_api.py

      - name: Fast Training Smoke Test (5 epochs)
        run: |
          python scripts/ci_fast_train.py
