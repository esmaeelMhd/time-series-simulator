# ─────────────────────────────────────────────────────────────────────
#  wastewater.yaml  –  full config for wastewater treatment dataset
#
#  Extends default.yaml with dataset info, model definitions, and
#  training rounds.  Override training/eval/sim/misc here as needed.
# ─────────────────────────────────────────────────────────────────────
_base: default.yaml

# ---------- dataset ----------
dataset:
  name: wastewater
  csv: datasets/wastewater.csv
  index_col: date
  seq_len: 24
  pred_len: 1
  batch_size: 32
  variables:
    control:   [IN_METAL_Q, T1_O2]
    exogenous: [METAL_Q, IN_Q, MAX_CF, PROCESSPHASE_INLET, PROCESSPHASE_OUTLET]
    objective: [T1_PO4]

# ---------- model I/O ----------
model_io:
  input_groups: ["control", "exogenous", "objective"]
  output_groups: ["objective"]

# ---------- models to compare ----------
models:
  - type: lstm
    hidden_dim: 128
    num_layers: 2
  - type: dlinear
    kernel_size: 25
  - type: nlinear
  - type: tft
    hidden_dim: 64
    n_heads: 4
    num_lstm_layers: 2
  - type: transformer
    d_model: 128
    nhead: 4
    num_layers: 2
  - type: xgboost
    n_estimators: 200
    max_depth: 6

# ---------- training rounds ----------
training_rounds:
  - name: train
    epochs: 50
    learning_rate: 0.001
    models: [lstm, dlinear, nlinear, tft, transformer, xgboost]

# ---------- overrides ----------
training:
  sampling_horizon: 12
