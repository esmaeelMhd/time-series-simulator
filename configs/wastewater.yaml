# ─────────────────────────────────────────────────────────────────────
#  wastewater.yaml  –  full config for wastewater treatment dataset
#
#  Extends default.yaml with dataset info, model definitions, and
#  training rounds.  Override training/eval/sim/misc here as needed.
# ─────────────────────────────────────────────────────────────────────
_base: default.yaml

# ---------- output ----------
output:
  runs_dir: runs
  run_name: full_with_time

# ---------- dataset ----------
dataset:
  name: wastewater
  csv: datasets/wastewater.csv
  index_col: date
  seq_len: 24
  pred_len: 1
  batch_size: 32
  variables:
    control:   [IN_METAL_Q, T1_O2]
    exogenous: [METAL_Q, IN_Q, MAX_CF, PROCESSPHASE_INLET, PROCESSPHASE_OUTLET]
    objective: [T1_PO4]

data:
  add_time_features: true
  time_features:
    enabled: true
    features: [hour, day_of_week, month]
    encoding: cyclical

# ---------- model I/O ----------
model_io:
  input_groups: ["control", "exogenous", "objective"]
  output_groups: ["objective"]

# ---------- models to compare ----------
models:
  - type: lstm
    hidden_dim: 32
    num_layers: 1
    dropout: 0.3
  - type: dlinear
    kernel_size: 25
  - type: nlinear
  - type: tft
    hidden_dim: 64
    n_heads: 4
    num_lstm_layers: 2
  - type: transformer
    d_model: 128
    nhead: 4
    num_layers: 2
  - type: latent_ssm
    hidden_dim: 96
    latent_dim: 24
    num_layers: 1
    dropout: 0.05
    learning_rate: 0.0005
    min_df: 2.2
  - type: xgboost
    n_estimators: 200
    max_depth: 6

# ---------- training rounds ----------
training_rounds:
  - name: train
    epochs: 50
    learning_rate: 0.001
    models: [lstm, dlinear, nlinear, tft, transformer, latent_ssm, xgboost]

simulation:
  horizon: 360                       # null → use all available val data
  start_idx: 0

# ---------- overrides ----------
training:
  steps_per_epoch: 1000              # null → use all available train data
  # Optional DTW-like fast shape-aware objective:
  # loss_type: shape
  # shape_loss:
  #   w_level: 0.5
  #   w_slope: 0.3
  #   w_curvature: 0.1
  #   w_stats: 0.1
  #   robust_beta: 1.0
  use_optuna_best_params: true
  # optuna_summary_path: null  # optional override; defaults to runs/<dataset>/<run_name>/optuna/summary.yaml
  warmup_len: 24
  sampling_strategy: random_fixed    # random_fixed | random_random | geometric | daily_fixed | stride
  sampling:
    strategy: random_fixed
    horizon: 120                      # for random_fixed / daily_fixed
    h_min: 1                          # for random_random
    h_max: 120                        # for random_random / geometric / stride
    stride: 12                        # for stride
    start_hour: 0                     # for daily_fixed
    samples_per_hour: 1               # for daily_fixed (e.g., 30 for 2-min data)
  checkpoint_simulation:
    enabled: true
    n_rounds: 4
    horizon: null
    start_idx: 0
  probabilistic:
    objective: elbo_plus_rollout_mse
    elbo_weight: 1.0
    kl_weight: 0.5
    rollout_mse_weight: 2.0
    kl_warmup_enabled: true
    kl_beta_start: 0.0
    kl_beta_end: 1.0
    kl_warmup_epochs: 20
    mc_train_samples: 8
  
  use_amp: true                        # mixed precision (cuda only); faster on tensor cores
  use_compile: false                   # torch.compile model for potential speedup
  compile_mode: default                # default | reduce-overhead | max-autotune

evaluation:
  probabilistic:
    mc_samples: 128
    interval_level: 0.90


# ---------- misc ---------------
misc:
  device: cuda
