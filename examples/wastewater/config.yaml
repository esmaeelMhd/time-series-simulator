# Example configuration for wastewater treatment plant world model training

dataset:
  name: wastewater
  csv: datasets/wastewater.csv
  index_col: date
  seq_len: 24
  pred_len: 12
  batch_size: 32
  train_split: 0.8
  
  # Variable groups (domain-specific)
  variables:
    control:   [IN_METAL_Q, T1_O2]           # Control inputs (actions)
    exogenous: [METAL_Q, IN_Q, MAX_CF, PROCESSPHASE_INLET, PROCESSPHASE_OUTLET]  # Disturbances
    objective: [T1_PO4]                      # Target outputs (KPIs)

model:
  type: lstm
  hidden_dim: 64
  num_layers: 2
  dropout: 0.1

training:
  # Training mode: "multi_step", "one_step", or "combined"
  mode: multi_step
  
  # Sampling strategy for multi-step training
  sampling:
    # Options: "random_random", "random_fixed", "daily_fixed", "geometric", "stride"
    strategy: random_fixed
    h_min: 12
    h_max: 48
    horizon: 24  # for random_fixed
    
    # For daily_fixed strategy (start-of-day + 24h horizon)
    # start_hour: 0
    # samples_per_hour: 30  # 2-minute data
  
  # Loss configuration
  loss_type: mse  # mse, mae, or huber
  
  # Feedback mode for rollouts: "model", "teacher", or "mixed"
  feedback: model
  teacher_forcing_ratio: 0.0  # for mixed mode
  
  # For combined training mode
  one_step_weight: 0.3
  multi_step_weight: 0.7
  
  # Optimization
  epochs: 50
  learning_rate: 0.001
  early_stopping: true
  patience: 10
  
  # Warmup length for state initialization
  warmup_len: 24

misc:
  device: cpu
  seed: 42
  run_dir: runs/wastewater/lstm
  use_gpu: true

model_io:
  input_groups:  ["control", "exogenous"]
  output_groups: ["objective"]

