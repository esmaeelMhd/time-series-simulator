version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # For GPU PyTorch wheels, override at build time, e.g.
        # docker compose build --build-arg PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu124
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    environment:
      TIMESIM_CONFIG: ${TIMESIM_CONFIG:-configs/wastewater.yaml}
      TIMESIM_CHECKPOINT: ${TIMESIM_CHECKPOINT:-runs/wastewater/full_with_time/latent_ssm/train_checkpoint.pth}
      TIMESIM_DEVICE: ${TIMESIM_DEVICE:-auto}
      TIMESIM_PORT: "8000"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

  # Optional GPU profile: `docker compose --profile gpu up api-gpu`
  api-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu124}
    environment:
      TIMESIM_CONFIG: ${TIMESIM_CONFIG:-configs/wastewater.yaml}
      TIMESIM_CHECKPOINT: ${TIMESIM_CHECKPOINT:-runs/wastewater/full_with_time/latent_ssm/train_checkpoint.pth}
      TIMESIM_DEVICE: ${TIMESIM_DEVICE:-cuda}
      TIMESIM_PORT: "8000"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    gpus: all

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - streamlit
      - run
      - scripts/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      - api
