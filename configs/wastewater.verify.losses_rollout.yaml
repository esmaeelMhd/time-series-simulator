_base: wastewater.yaml

output:
  runs_dir: runs
  run_name: checklist_loss_eval_rollout

models:
  - type: latent_ssm
    hidden_dim: 64
    latent_dim: 24
    num_layers: 1
    dropout: 0.10
    learning_rate: 0.0005
    min_scale: 0.01
    use_symlog: true
    min_df: 2.2
    use_aux_decoder: true
    use_dual_path: true
    leak_objective_to_transition: false

training_rounds:
  - name: train
    epochs: 40
    models: [latent_ssm]

training:
  use_optuna_best_params: false
  steps_per_epoch: 40
  early_stopping: false
  optimizer: adamw
  weight_decay: 0.000001
  probabilistic:
    objective: rssm
    recon_weight: 1.0
    kl_weight: 0.15
    aux_weight: 2.0
    rollout_weight: 1.0
    rollout_dtw_weight: 0.0
    rollout_dtw_gamma: 0.1
    rollout_warmup_fraction: 0.30
    rollout_max_horizon: 8
    min_context: 16
    kl_free_bits: 0.5
    kl_balance: 0.8
    use_kl_balancing: true
    use_free_bits: true
    grad_clip_norm: 100.0
    lr_warmup_steps: 1000
    lr_min_ratio: 0.01
    kl_warmup_enabled: true
    kl_beta_start: 0.0
    kl_beta_end: 1.0
    kl_warmup_epochs: 15
    checkpoint_metric: open_loop_crps
    checkpoint_open_loop_horizon: 20
    checkpoint_open_loop_windows: 4
    checkpoint_open_loop_samples: 64

misc:
  device: cuda

evaluation:
  test_split: 0.1
  horizon: 180
  n_windows: 32
  latent_n_windows: 32
  interventional:
    scenario: step
    control_index: 1
    objective_index: 0
    control_step_size: 1.0
    expected_direction_sign: -1
