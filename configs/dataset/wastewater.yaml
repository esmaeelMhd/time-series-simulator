# @package _global_
#
# Dataset provenance
# ------------------
# This config expects a published wastewater-treatment dataset, captured
# at two-minute intervals through the plant SCADA system and released as a data
# paper: "Wastewater Treatment Plant Data for Nutrient Removal System",
# arXiv:2407.05346 (https://arxiv.org/abs/2407.05346).
#
# The CSV itself is not distributed with this repository. Download it from the
# source above and place it at the `dataset.csv` path below. The variable names
# in this file are the column names used by that dataset.

dataset:
  name: wastewater
  csv: datasets/wastewater.csv
  index_col: date
  # seq_len/pred_len define windowing for grouped datasets and are also used by
  # evaluation/simulation utilities. RSSM training additionally uses
  # training.warmup_len + training.sampling.horizon for curriculum behavior.
  seq_len: 128
  pred_len: 1
  batch_size: 512
  variables:
    control: [IN_METAL_Q, T1_O2, METAL_Q]
    exogenous: [IN_Q, MAX_CF, PROCESSPHASE_INLET, PROCESSPHASE_OUTLET]
    objective: [T1_PO4]

data:
  csv_engine: pandas
  splits:
    train: 0.70
    val: 0.15
    test: 0.15
  shuffle_train: true
  drop_last: true
  num_workers: 8
  pin_memory: true
  window_stride: 1
  shuffle_within_window: false
  require_full_role_mapping: true
  time_features:
    enabled: true
    features: [hour, day_of_week, month]
    encoding: cyclical
  validation:
    enabled: true
    strict: false
    require_datetime_index: true
    require_monotonic_index: true
    require_numeric_dtypes: true
    allow_nan: false
    coerce_numeric: false
  symlog:
    enabled: false
    columns: null

model_io:
  input_groups: ["control", "exogenous", "objective"]
  output_groups: ["objective"]
