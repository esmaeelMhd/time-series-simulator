_base: default.yaml

output:
  runs_dir: runs
  run_name: full_with_time

dataset:
  name: wastewater
  csv: datasets/wastewater.csv
  index_col: date
  seq_len: 24
  pred_len: 1
  batch_size: 32
  variables:
    control: [IN_METAL_Q, T1_O2]
    exogenous: [METAL_Q, IN_Q, MAX_CF, PROCESSPHASE_INLET, PROCESSPHASE_OUTLET]
    objective: [T1_PO4]

data:
  add_time_features: true
  require_full_role_mapping: true
  time_features:
    enabled: true
    features: [hour, day_of_week, month]
    encoding: cyclical

model_io:
  input_groups: ["control", "exogenous", "objective"]
  output_groups: ["objective"]

models:
  - type: lstm
    hidden_dim: 32
    num_layers: 1
    dropout: 0.3
  - type: dlinear
    kernel_size: 25
  - type: nlinear
  - type: tft
    hidden_dim: 64
    n_heads: 4
    num_lstm_layers: 2
  - type: transformer
    d_model: 128
    nhead: 4
    num_layers: 2
  - type: latent_ssm
    hidden_dim: 96
    latent_dim: 24
    num_layers: 1
    dropout: 0.05
    learning_rate: 0.0005
    min_df: 2.2
    use_aux_decoder: true
    use_dual_path: true
    leak_objective_to_transition: false
  - type: xgboost
    n_estimators: 200
    max_depth: 6

training_rounds:
  - name: train
    epochs: 50
    learning_rate: 0.001
    models: [lstm, dlinear, nlinear, tft, transformer, latent_ssm, xgboost]

simulation:
  horizon: 360
  start_idx: 0

training:
  steps_per_epoch: 1000
  optimizer: adamw
  weight_decay: 0.000001
  patience: 30
  use_optuna_best_params: true
  warmup_len: 24
  sampling_strategy: random_fixed
  sampling:
    strategy: random_fixed
    horizon: 120
    h_min: 1
    h_max: 120
    stride: 12
    start_hour: 0
    samples_per_hour: 1
  checkpoint_simulation:
    enabled: true
    n_rounds: 4
    horizon: null
    start_idx: 0
  sequence_curriculum:
    enabled: false
    start_horizon: 16
    target_horizon: 120
  probabilistic:
    objective: rssm
    recon_weight: 1.0
    kl_weight: 0.5
    aux_weight: 2.0
    rollout_weight: 0.0
    rollout_dtw_weight: 0.0
    rollout_dtw_gamma: 0.1
    rollout_warmup_fraction: 0.30
    rollout_max_horizon: 24
    min_context: 16
    kl_warmup_enabled: true
    kl_beta_start: 0.0
    kl_beta_end: 1.0
    kl_warmup_epochs: 20
    mc_train_samples: 8
    checkpoint_metric: open_loop_crps
    checkpoint_open_loop_horizon: 120
    checkpoint_open_loop_windows: 4
    checkpoint_open_loop_samples: 64
    lr_min_ratio: 0.01
    checkpoint_top_k: 3
  use_amp: true
  use_compile: false
  compile_mode: default

evaluation:
  probabilistic:
    mc_samples: 128
    sigma_scale: 1.0
    interval_level: 0.90

misc:
  device: cuda
