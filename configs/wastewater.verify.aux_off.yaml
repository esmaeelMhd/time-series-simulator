_base: wastewater.verify.base.yaml

output:
  runs_dir: runs
  run_name: checklist_verify_aux_off

models:
  - type: latent_ssm
    hidden_dim: 96
    latent_dim: 24
    num_layers: 1
    dropout: 0.05
    learning_rate: 0.0005
    min_df: 2.2
    use_aux_decoder: false
    use_dual_path: true
    leak_objective_to_transition: false
