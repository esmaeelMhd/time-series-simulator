# ─────────────────────────────────────────────────────────────────────
#  default.yaml  –  shared defaults for ALL datasets
#
#  Dataset-specific configs extend this via  _base: default.yaml
#  Every configurable parameter in the timesim package lives here
#  with a sensible default.  Override only what you need in your
#  dataset config.
# ─────────────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════════════
#  TRAINING
# ══════════════════════════════════════════════════════════════════════
training:
  epochs: 50
  steps_per_epoch: null              # null => auto from dataset size; set int to cap epoch cost
  learning_rate: 0.0003
  optimizer: adamw                    # adam | sgd | adamw
  weight_decay: 0.000001              # optimizer weight decay (L2 regularization)
  warmup_len: 24                     # context / burn-in length for rollouts
  sampling_strategy: random_fixed    # random_fixed | random_random | geometric | daily_fixed | stride
  sampling_horizon: 12               # backward-compatible alias for fixed-horizon sampling
  sampling:
    strategy: random_fixed
    horizon: 12                      # for random_fixed / daily_fixed
    h_min: 1                         # for random_random
    h_max: 24                        # for random_random / geometric / stride
    stride: 12                       # for stride
    start_hour: 0                    # for daily_fixed
    samples_per_hour: 1              # for daily_fixed (e.g., 30 for 2-min data)

  # Loss
  loss_type: mse                     # mse | mae | huber | shape
  loss_weighting: uniform            # uniform | linear | exponential
  loss_weight_scale: 1.0             # scale factor for exponential weighting
  shape_loss:
    w_level: 0.5                     # pointwise fit term
    w_slope: 0.3                     # first-derivative (trend) term
    w_curvature: 0.1                 # second-derivative term
    w_stats: 0.1                     # mean/std summary term
    robust_beta: 1.0                 # smooth-l1 transition; smaller -> more robust

  # Training mode
  mode: multi_step                   # multi_step | one_step | combined
  one_step_weight: 0.5               # weight for one-step loss in combined mode
  feedback: model                    # model | teacher | mixed
  teacher_forcing_ratio: 0.0         # probability of teacher-forcing (0 = none)

  # Early stopping
  early_stopping: true
  patience: 30
  min_delta: 0.0                       # minimum improvement to reset patience
  checkpoint_simulation:
    enabled: false                     # run monitoring simulation when checkpoint improves
    n_rounds: 0                        # number of simulation snapshots per improved epoch
    horizon: null                      # null -> fallback to simulation.horizon
    start_idx: 0                       # first snapshot index; remaining snapshots use random indices
  sequence_curriculum:
    enabled: false
    start_horizon: 16
    target_horizon: 64
  probabilistic:
    enabled: true
    objective: rssm
    recon_weight: 1.0
    kl_weight: 1.0
    aux_weight: 1.0
    rollout_weight: 0.0               # weight for prior-only rollout loss
    rollout_dtw_weight: 0.0           # soft-DTW term in rollout loss (off by default)
    rollout_dtw_gamma: 0.1            # smoothing for soft-DTW
    rollout_warmup_fraction: 0.30     # first fraction of epochs with rollout horizon=0
    rollout_max_horizon: 24           # maximum imagined horizon used for rollout loss
    min_context: 16                   # enforce context_len >= min_context
    kl_free_bits: 1.0
    kl_balance: 0.8
    use_kl_balancing: true
    use_free_bits: true
    use_symlog: false
    grad_clip_norm: 100.0
    lr_warmup_steps: 1000
    lr_min_ratio: 0.01
    checkpoint_top_k: 3
    kl_warmup_enabled: true
    kl_beta_start: 0.0
    kl_beta_end: 1.0
    kl_warmup_epochs: 10
    mc_train_samples: 1
    checkpoint_metric: open_loop_crps
    checkpoint_open_loop_horizon: 24
    checkpoint_open_loop_windows: 4
    checkpoint_open_loop_samples: 32

  # Hyperparameters and fast training
  use_optuna_best_params: false        # if true, load per-model best_params from Optuna summary
  optuna_summary_path: null            # null -> <runs_dir>/<dataset>/<run_name>/optuna/summary.yaml
  use_amp: false                       # mixed precision (cuda only); faster on tensor cores
  use_compile: false                   # torch.compile model for potential speedup
  compile_mode: default                # default | reduce-overhead | max-autotune

# ══════════════════════════════════════════════════════════════════════
#  OPTIMIZATION (Optuna)
# ══════════════════════════════════════════════════════════════════════
optimization:
  n_trials: 30                       # Optuna trials per model
  timeout: null                      # seconds per model; null = no timeout
  epochs: 5                          # training epochs per trial
  steps_per_epoch: 200               # null -> auto; set int for fast tuning
  direction: minimize                # minimize objective metric (open-loop CRPS@horizon)
  objective_horizon: 10              # objective = validation open-loop CRPS at this horizon
  search_space_profile: fast_gpu     # fast_gpu | wide
  seed: 42
  models: null                       # null -> use config.models list
  fast_mode: false                   # if true, use fast_* settings below by default
  fast_epochs: 1                     # epochs per trial in fast mode
  fast_steps_per_epoch: 40           # steps per epoch in fast mode
  fast_sampling_horizon: 24          # override sampling horizon in fast mode
  fast_training_mode: one_step       # one_step | multi_step | combined for fast mode
  enable_pruning: true               # prune weak trials early
  pruner_startup_trials: 5           # full trials before pruning starts
  pruner_warmup_steps: 20            # MedianPruner warmup epochs before pruning can trigger
  pruner_min_epochs: 20              # hard floor: never prune before this many epochs in a trial

# ══════════════════════════════════════════════════════════════════════
#  DATA
# ══════════════════════════════════════════════════════════════════════
data:
  train_split: 0.7
  splits:
    train: 0.70
    val: 0.15
    test: 0.15
  default_train_ratio: 0.70
  default_val_ratio: 0.15
  default_test_ratio: 0.15
  shuffle_train: true
  shuffle_within_window: false      # DO-NOT: never shuffle timesteps inside a sequence window
  drop_last: true
  batch_size: 32
  num_workers: 0
  pin_memory: false
  window_stride: 1
  csv_engine: pandas                 # pandas | polars
  validation:
    enabled: true                    # optional Pandera validation
    strict: false                    # if true, require pandera installed
    require_datetime_index: true
    require_monotonic_index: true
    require_numeric_dtypes: true
    allow_nan: false
    required_columns: null
  require_full_role_mapping: true      # require every dataset column be mapped to control/exogenous/objective
  scale: true                        # apply MinMaxScaler
  add_time_features: false           # legacy switch; same as data.time_features.enabled
  time_features:
    enabled: false
    features: [hour]                 # hour | day_of_week | day_of_month | month | day_of_year | week_of_year
    encoding: cyclical               # raw | cyclical | both | onehot
  symlog:
    enabled: false
    columns: null                    # null | all | [col1, col2, ...]
  index_col: date                    # name of datetime index column
  parse_dates: true

# ══════════════════════════════════════════════════════════════════════
#  EVALUATION
# ══════════════════════════════════════════════════════════════════════
evaluation:
  horizon: 180                        # rollout evaluation horizon
  n_windows: 8                        # number of validation windows
  test_split: null                    # optional holdout fraction for eval-only test split
  probabilistic:
    mc_samples: 256
    interval_level: 0.90

# ══════════════════════════════════════════════════════════════════════
#  SIMULATION  (recursive step-by-step)
# ══════════════════════════════════════════════════════════════════════
simulation:
  horizon: null                      # null → use all available val data
  start_idx: 0

# ══════════════════════════════════════════════════════════════════════
#  MODEL DEFAULTS  (fallbacks when not overridden per-model)
# ══════════════════════════════════════════════════════════════════════
model_defaults:
  lstm:
    hidden_dim: 64
    num_layers: 2
    dropout: 0.0
  dlinear:
    kernel_size: 25
    individual: false
  nlinear:
    individual: false
  tft:
    hidden_dim: 64
    n_heads: 4
    num_lstm_layers: 2
    dropout: 0.1
  transformer:
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
  latent_ssm:
    hidden_dim: 64
    latent_dim: 16
    num_layers: 1
    dropout: 0.1
    min_scale: 0.0001
    min_df: 2.1
    encoder_dim: 64
    decoder_layers: 2
    use_symlog: false
    use_aux_decoder: true
    use_dual_path: true
    use_stochastic_path: true
    share_encoder_weights: false
    leak_objective_to_transition: false
    allow_objective_leak_for_ablation: false
    allow_disable_aux_decoder_for_ablation: false
    allow_shared_encoder_for_ablation: false
    allow_disable_stochastic_for_ablation: false
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    n_jobs: -1
    early_stopping_rounds: 10
    objective: "reg:squarederror"

# ══════════════════════════════════════════════════════════════════════
#  PLOTTING
# ══════════════════════════════════════════════════════════════════════
plotting:
  style: "seaborn-v0_8-whitegrid"
  dpi: 150
  font_size: 10
  legend_font_size: 9
  model_colors:
    - "#2E86AB"
    - "#E94F37"
    - "#2CA58D"
    - "#F18F01"
    - "#A23B72"
    - "#84BC9C"
    - "#BC5D2E"
    - "#6F2DBD"

# ══════════════════════════════════════════════════════════════════════
#  OUTPUT
# ══════════════════════════════════════════════════════════════════════
output:
  runs_dir: runs                     # base directory for all run artifacts
  run_name: null                     # optional subfolder under runs/<dataset>/

# Optional experiment tracking backend
tracking:
  backend: none                      # none | wandb | mlflow
  project: timesim
  run_name: null
  tags: []
  log_config: true

# ══════════════════════════════════════════════════════════════════════
#  MISC
# ══════════════════════════════════════════════════════════════════════
misc:
  device: auto
  seed: 42
  deterministic: false
