# ─────────────────────────────────────────────────────────────────────
#  test_small.yml  –  quick smoke-test config
#  Identical structure to base.yml but smaller data / fewer epochs.
# ─────────────────────────────────────────────────────────────────────

# ---------- dataset ----------
dataset:
  name: myplant
  seq_len: 24
  pred_len: 1
  batch_size: 16
  csv: datasets/wastewater.csv
  index_col: date
  variables:
    control:   [IN_METAL_Q, T1_O2]
    exogenous: [METAL_Q, IN_Q, MAX_CF, PROCESSPHASE_INLET, PROCESSPHASE_OUTLET]
    objective: [T1_PO4]
  slice:
    first_n: 10000

# ---------- model I/O ----------
model_io:
  input_groups:  ["control"]
  output_groups: ["objective"]

# ---------- models to compare ----------
models:
  - type: lstm
    hidden_dim: 32
    num_layers: 1
  - type: dlinear
    kernel_size: 13
  - type: nlinear
  - type: tft
    hidden_dim: 32
    n_heads: 4
    num_lstm_layers: 1
  - type: transformer
    d_model: 32
    nhead: 4
    num_layers: 1
  - type: xgboost
    n_estimators: 50
    max_depth: 4

# ---------- training defaults ----------
training:
  epochs: 3
  learning_rate: 0.001
  warmup_len: 24
  loss_type: mse
  mode: multi_step
  sampling_horizon: 1

# ---------- training rounds ----------
# Flexible: include only the rounds you need.
#   train only   → keep only the "train" entry
#   retrain only → keep only the "retrain" entry (+ optional checkpoint_dir)
#   both         → keep both entries (train first, then retrain)
#
# For retrain-only from a previous run, add:
#   checkpoint_dir: runs/myplant/compare_XXXXXXXX_XXXXXX
training_rounds:
  - name: train
    epochs: 3
    learning_rate: 0.001
    models: [lstm, dlinear, nlinear, tft, transformer, xgboost]
  - name: retrain
    epochs: 2
    learning_rate: 0.0005
    models: [lstm, transformer, xgboost]

# ---------- evaluation ----------
evaluation:
  horizon: 12
  n_windows: 4

# ---------- simulation ----------
simulation:
  horizon: 100
  start_idx: 0

# ---------- misc ----------
misc:
  device: cpu
  seed: 42
