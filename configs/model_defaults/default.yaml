# @package _global_

model_defaults:
  lstm:
    hidden_dim: 64
    num_layers: 2
    dropout: 0.0
  dlinear:
    kernel_size: 25
    individual: false
  nlinear:
    individual: false
  tft:
    hidden_dim: 64
    n_heads: 4
    num_lstm_layers: 2
    dropout: 0.1
  transformer:
    d_model: 64
    nhead: 4
    num_layers: 2
    dim_feedforward: 128
    dropout: 0.1
  latent_ssm:
    hidden_dim: 64
    latent_dim: 16
    num_layers: 1
    dropout: 0.1
    min_std: 0.5
    decoder_min_std: 0.5
    decoder_max_std: 2.0
    prior_min_std: 0.1
    prior_max_std: 1.5
    posterior_min_std: 0.1
    posterior_max_std: 1.5
    prior_constant_std: null
    posterior_constant_std: null
    min_df: 2.1
    encoder_dim: 64
    decoder_layers: 2
    use_symlog: false
    use_aux_decoder: true
    predict_exogenous: true
    use_dual_path: true
    use_stochastic_path: true
    share_encoder_weights: false
    leak_objective_to_transition: false
    allow_objective_leak_for_ablation: false
    allow_disable_aux_decoder_for_ablation: false
    allow_shared_encoder_for_ablation: false
    allow_disable_stochastic_for_ablation: false
  xgboost:
    strategy: recursive
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    n_jobs: -1
    early_stopping_rounds: 10
    objective: reg:squarederror
