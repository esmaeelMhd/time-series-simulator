# wastewater.small.yaml - quick smoke-test variant
# Extends wastewater.yaml with smaller data/fewer epochs.
_base: wastewater.yaml

# ---------- output ----------
output:
  runs_dir: runs
  run_name: small

# ---------- dataset overrides ----------
dataset:
  batch_size: 16
  pred_len: 1
  slice:
    first_n: 1000

# ---------- smaller models ----------
models:
  - type: lstm
    hidden_dim: 32
    num_layers: 1
  - type: dlinear
    kernel_size: 13
  - type: nlinear
  - type: tft
    hidden_dim: 32
    n_heads: 4
    num_lstm_layers: 1
  - type: transformer
    d_model: 32
    nhead: 4
    num_layers: 1
  - type: latent_ssm
    hidden_dim: 32
    latent_dim: 8
    num_layers: 1
    dropout: 0.1
    learning_rate: 0.0007
    min_df: 2.2
  - type: xgboost
    n_estimators: 50
    max_depth: 4

# ---------- training rounds ----------
training_rounds:
  - name: train
    epochs: 3
    learning_rate: 0.001
    models: [lstm, dlinear, nlinear, tft, transformer, latent_ssm, xgboost]
  - name: retrain
    epochs: 2
    learning_rate: 0.0005
    models: [lstm, transformer, latent_ssm, xgboost]

# ---------- overrides ----------
training:
  steps_per_epoch: null
  sampling:
    horizon: 12
  probabilistic:
    objective: rssm
    recon_weight: 1.0
    kl_weight: 0.5
    aux_weight: 2.0
    kl_warmup_enabled: true
    kl_beta_start: 0.0
    kl_beta_end: 1.0
    kl_warmup_epochs: 2
    mc_train_samples: 4

evaluation:
  horizon: 12
  n_windows: 4
  probabilistic:
    mc_samples: 64
    interval_level: 0.90

simulation:
  horizon: 100
  start_idx: 0

model_io:
  input_groups: ["control"]
  output_groups: ["objective"]

# ---------- misc ----------
misc:
  device: cpu
