# ---------- dataset ----------
dataset:
  name: myplant
  seq_len: 24
  pred_len: 12
  batch_size: 32
  csv: datasets/wastewater.csv
  index_col: date
  variables:
    control:   [IN_METAL_Q, T1_O2]      # C
    exogenous: [METAL_Q, IN_Q, MAX_CF, PROCESSPHASE_INLET, PROCESSPHASE_OUTLET]          # E
    objective: [T1_PO4]           # O
  slice:
    first_n: 3000        # use only the first 3 k rows
    # --- OR ---
    # start: '2021-08-01'
    # end:   '2021-08-10'
# ---------- model -------------
model:
  type: lstm
  hidden_dim: 32
  num_layers: 1
# ---------- model I/O ---------
model_io:
  input_groups:  ["control"]     # irrelevant for sine
  output_groups: ["objective"]
# ---------- training ----------
training:
  epochs: 2                        # just two epochs
# ---------- retrain -----------
retrain:
  method: sepp
  epochs: 10
  sepp_h_max: 12                # 2× pred_len
  sepp_stride: 6                # = pred_len
  patience: 3
  sim_points: 4
