# ─────────────────────────────────────────────────────────────────────
#  wastewater.yaml  –  full config for wastewater treatment dataset
#
#  Extends default.yaml with dataset info, model definitions, and
#  training rounds.  Override training/eval/sim/misc here as needed.
# ─────────────────────────────────────────────────────────────────────
_base: default.yaml

# ---------- output ----------
output:
  runs_dir: runs
  run_name: full

# ---------- dataset ----------
dataset:
  name: wastewater
  csv: datasets/wastewater.csv
  index_col: date
  seq_len: 24
  pred_len: 1
  batch_size: 32
  variables:
    control:   [IN_METAL_Q, T1_O2]
    exogenous: [METAL_Q, IN_Q, MAX_CF, PROCESSPHASE_INLET, PROCESSPHASE_OUTLET]
    objective: [T1_PO4]

# ---------- model I/O ----------
model_io:
  input_groups: ["control", "exogenous", "objective"]
  output_groups: ["objective"]

# ---------- models to compare ----------
models:
  - type: lstm
    hidden_dim: 32
    num_layers: 1
    dropout: 0.3
  - type: dlinear
    kernel_size: 25
  - type: nlinear
  - type: tft
    hidden_dim: 64
    n_heads: 4
    num_lstm_layers: 2
  - type: transformer
    d_model: 128
    nhead: 4
    num_layers: 2
  - type: xgboost
    n_estimators: 200
    max_depth: 6

# ---------- training rounds ----------
training_rounds:
  - name: train
    epochs: 50
    learning_rate: 0.001
    models: [lstm, dlinear, nlinear, tft, transformer, xgboost]

simulation:
  horizon: 360                       # null → use all available val data
  start_idx: 0

# ---------- overrides ----------
training:
  warmup_len: 24
  sampling_strategy: random_fixed    # random_fixed | random_random | geometric | daily_fixed | stride
  sampling:
    strategy: random_fixed
    horizon: 360                      # for random_fixed / daily_fixed
    h_min: 1                          # for random_random
    h_max: 360                        # for random_random / geometric / stride
    stride: 12                        # for stride
    start_hour: 0                     # for daily_fixed
    samples_per_hour: 1               # for daily_fixed (e.g., 30 for 2-min data)

# ---------- misc ---------------
misc:
  device: cuda
