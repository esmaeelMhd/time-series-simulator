dataset:
  name: wastewater
  csv: datasets/wastewater.csv
  index_col: date
  seq_len: 24
  pred_len: 1
  batch_size: 16
  variables:
    control:
    - IN_METAL_Q
    - T1_O2
    exogenous:
    - METAL_Q
    - IN_Q
    - MAX_CF
    - PROCESSPHASE_INLET
    - PROCESSPHASE_OUTLET
    objective:
    - T1_PO4
  slice:
    first_n: 1000
data:
  csv_engine: pandas
  train_split: 0.7
  splits:
    train: 0.7
    val: 0.15
    test: 0.15
  default_train_ratio: 0.7
  default_val_ratio: 0.15
  default_test_ratio: 0.15
  shuffle_train: true
  drop_last: true
  batch_size: 32
  num_workers: 0
  pin_memory: false
  window_stride: 1
  shuffle_within_window: false
  index_col: date
  require_full_role_mapping: true
  add_time_features: true
  time_features:
    enabled: true
    features:
    - hour
    - day_of_week
    - month
    encoding: cyclical
  validation:
    enabled: true
    strict: false
    require_datetime_index: true
    require_monotonic_index: true
    require_numeric_dtypes: true
    allow_nan: false
    coerce_numeric: false
  symlog:
    enabled: false
    columns: null
model_io:
  input_groups:
  - control
  output_groups:
  - objective
model:
  name: rssm_wastewater
  type: latent_ssm
  dim_h: null
  dim_z: null
  hidden_dim: 96
  latent_dim: 24
  encoder_dim: 64
  decoder_layers: 2
  num_layers: 1
  dropout: 0.05
  min_scale: 0.02
  min_df: 2.2
  use_symlog: false
  use_aux_decoder: true
  use_dual_path: true
  use_stochastic_path: true
  share_encoder_weights: false
  leak_objective_to_transition: false
training:
  epochs: 50
  steps_per_epoch: null
  learning_rate: 0.0005
  optimizer: adamw
  weight_decay: 1.0e-06
  grad_clip_norm: 100.0
  lr_warmup_steps: 1000
  lr_min_ratio: 0.01
  patience: 30
  warmup_len: 24
  use_optuna_best_params: true
  sampling_strategy: random_fixed
  sampling:
    strategy: random_fixed
    horizon: 12
    h_min: 1
    h_max: 120
    stride: 12
    start_hour: 0
    samples_per_hour: 1
  checkpoint_simulation:
    enabled: true
    n_rounds: 4
    horizon: null
    start_idx: 0
  sequence_curriculum:
    enabled: false
    start_horizon: 16
    target_horizon: 120
  probabilistic:
    enabled: true
    objective: rssm
    recon_weight: 1.0
    kl_weight: 0.5
    aux_weight: 2.0
    rollout_weight: 0.0
    rollout_dtw_weight: 0.0
    rollout_dtw_gamma: 0.1
    rollout_warmup_fraction: 0.3
    rollout_max_horizon: 24
    min_context: 16
    kl_free_bits: 1.0
    kl_balance: 0.8
    use_kl_balancing: true
    use_free_bits: true
    kl_warmup_enabled: true
    kl_beta_start: 0.0
    kl_beta_end: 1.0
    kl_warmup_epochs: 2
    mc_train_samples: 4
    checkpoint_metric: open_loop_crps
    checkpoint_open_loop_horizon: 120
    checkpoint_open_loop_windows: 4
    checkpoint_open_loop_samples: 64
    checkpoint_top_k: 3
  use_amp: true
  use_compile: false
  compile_mode: default
training_rounds:
- name: train
  epochs: 3
  learning_rate: 0.001
  models:
  - latent_ssm
- name: retrain
  epochs: 2
  learning_rate: 0.0005
  models:
  - latent_ssm
evaluation:
  probabilistic:
    mc_samples: 64
    sigma_scale: 1.0
    interval_level: 0.9
  horizon: 12
  n_windows: 4
simulation:
  horizon: 100
  start_idx: 0
serving:
  host: 0.0.0.0
  port: 8000
  session_ttl_seconds: 3600
  sigma_scale: 1.0
output:
  run_name: small
misc:
  device: auto
models:
- latent_ssm
epochs: 1
steps_per_epoch: 1
device: cpu
use_optuna_best_params: null
optuna_summary: null
