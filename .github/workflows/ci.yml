name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,serving]"
          python -m pip install ruff

      - name: Lint
        run: |
          ruff check src scripts tests

      - name: Unit Tests
        run: |
          pytest tests/

      - name: Fast Training Smoke Test (5 epochs)
        run: |
          python scripts/ci_fast_train.py
